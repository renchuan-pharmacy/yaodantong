.drug-hero h3{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:4px;}
.drug-hero .en{font-size:13px;opacity:0.85;}
.drug-hero .cat{display:inline-block;background:rgba(255,255,255,0.2);font-size:12px;padding:3px 10px;border-radius:20px;margin-top:6px;}

.orange-header{background:#e67e22;border-radius:16px 16px 0 0;padding:14px 18px;}

.supp-item .s-desc{font-size:12px;color:#aaa;margin-top:3px;}

.empty-state .icon{font-size:40px;display:block;margin-bottom:12px;}

.api-result-en{font-size:12px;color:#888;margin-bottom:8px;}
.api-result-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.api-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#e8f5ee;color:#1a6b4a;font-weight:600;}
.api-tag-gray{background:#f0f2f5;color:#666;}
.loading{text-align:center;padding:24px;color:#888;font-size:14px;}
.loading-icon{font-size:32px;display:block;margin-bottom:8px;animation:spin 1s linear infinite;}

const ALIAS={};
Object.keys(DB).forEach(k=>{if(DB[k].alias)ALIAS[k.toLowerCase()]=DB[k].alias.toLowerCase();});

function findLocal(name){
  const n=name.toLowerCase().trim();
  if(DB[n]&&!DB[n].alias)return DB[n];
  if(DB[n]&&DB[n].alias)return DB[DB[n].alias.toLowerCase()];
  if(ALIAS[n])return DB[ALIAS[n]];
  for(const k of Object.keys(DB)){
    if(k.includes(n)||n.includes(k)){
      if(DB[k].alias)return DB[DB[k].alias.toLowerCase()];
      if(DB[k].name)return DB[k];
    }
  }
  for(const k of Object.keys(DB)){
    if(DB[k].en&&DB[k].en.toLowerCase().includes(n)){return DB[k];}
    if(DB[k].name&&DB[k].name.toLowerCase().includes(n)){
      if(DB[k].alias)return DB[DB[k].alias.toLowerCase()];
      return DB[k];
    }
  }
  return null;
}

function qs(name){document.getElementById('drugInput').value=name;searchDrug();}

async function searchDrug(){
  const name=document.getElementById('drugInput').value.trim();
  if(!name)return;
  const box=document.getElementById('resultBox');

  // 先查內建資料庫（有詳細說明）
  const local=findLocal(name);
  if(local){renderResult(local);return;}

  // 內建找不到 → 查 API（22萬筆健保資料）
  box.innerHTML=`<div class="loading"><span class="loading-icon">🔍</span>查詢健保藥品資料庫中...</div>`;
  try{
    const resp=await fetch(`${API_URL}/?keyword=${encodeURIComponent(name)}&limit=10`);
    const json=await resp.json();
    if(json.success&&json.data&&json.data.length>0){
      renderApiResults(name,json);
    } else {
      renderNotFound(name);
    }
  } catch(e){
    renderNotFound(name);
  }
}

function renderApiResults(keyword,json){
  const cards=json.data.map(d=>`
    <div class="api-result-card">
      <div class="api-result-name">💊 ${d.nameZh||d.nameEn||'未知藥品'}</div>
      ${d.nameEn?`<div class="api-result-en">${d.nameEn}</div>`:''}
      <div class="api-result-row">
        ${d.ingredient?`<span class="api-tag">成分：${d.ingredient.substring(0,30)}</span>`:''}
        ${d.dosageForm?`<span class="api-tag api-tag-gray">${d.dosageForm}</span>`:''}
        ${d.specification?`<span class="api-tag api-tag-gray">${d.specification}</span>`:''}
        ${d.price&&d.price!='0.00'?`<span class="api-tag">健保價 ${d.price} 元</span>`:''}
        ${d.atcCode?`<span class="api-tag api-tag-gray">ATC: ${d.atcCode}</span>`:''}
      </div>
      ${d.manufacturer?`<div style="font-size:11px;color:#aaa;margin-top:6px;">製造廠：${d.manufacturer}</div>`:''}
    </div>
  `).join('');

  document.getElementById('resultBox').innerHTML=`
    <div class="section-card" style="margin-bottom:12px;">
      <div class="section-label">🔍 「${keyword}」的健保藥品查詢結果</div>
      <div style="font-size:12px;color:#aaa;">共找到 ${json.total} 筆・顯示前 ${json.count} 筆</div>
    </div>
    ${cards}
    <div class="api-source-badge">資料來源：衛生福利部中央健康保險署</div>
    <div class="contact-card" style="margin-top:12px;">
      <p>需要詳細用藥說明？歡迎詢問藥師</p>
      <div class="line-id">💬 仁川藥局 @179ewiti</div>
      <button class="line-big-btn" onclick="openLine()">立即聯繫藥師</button>
    </div>
    <button class="again-btn" onclick="resetSearch()">🔍 再查詢另一個藥品</button>`;
}
