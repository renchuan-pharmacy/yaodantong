const ALIAS={};
Object.keys(DB).forEach(k=>{if(DB[k].alias)ALIAS[k.toLowerCase()]=DB[k].alias.toLowerCase();});

function findLocal(name){
  const n=name.toLowerCase().trim();
  if(DB[n]&&!DB[n].alias)return DB[n];
  if(DB[n]&&DB[n].alias)return DB[DB[n].alias.toLowerCase()];
  if(ALIAS[n])return DB[ALIAS[n]];
  for(const k of Object.keys(DB)){
    if(k.includes(n)||n.includes(k)){
      if(DB[k].alias)return DB[DB[k].alias.toLowerCase()];
      if(DB[k].name)return DB[k];
    }
  }
  for(const k of Object.keys(DB)){
    if(DB[k].en&&DB[k].en.toLowerCase().includes(n))return DB[k];
    if(DB[k].name&&DB[k].name.toLowerCase().includes(n)){
      if(DB[k].alias)return DB[DB[k].alias.toLowerCase()];
      return DB[k];
    }
  }
  return null;
}

function findAiDrug(name, aiDB) {
  if (!aiDB) return null;
  const n = name.toLowerCase().trim();
  for (const k of Object.keys(aiDB)) {
    if (k.toLowerCase().includes(n) || n.includes(k.toLowerCase())) return aiDB[k];
  }
  for (const k of Object.keys(aiDB)) {
    const d = aiDB[k];
    if (d.name && d.name.includes(name)) return d;
    if (d.en && d.en.toLowerCase().includes(n)) return d;
  }
  return null;
}

function qs(name){document.getElementById('drugInput').value=name;searchDrug();}

async function searchDrug(){
  const name=document.getElementById('drugInput').value.trim();
  if(!name)return;
  const box=document.getElementById('resultBox');
  const local=findLocal(name);
  if(local){renderResult(local,false);return;}
  box.innerHTML=`<div class="loading"><span class="loading-icon">🔍</span>查詢中...</div>`;
  const aiDB=await loadAiDB();
  const aiDrug=findAiDrug(name,aiDB);
  if(aiDrug){renderResult(aiDrug,true);return;}
  try{
    const resp=await fetch(`${API_URL}/?keyword=${encodeURIComponent(name)}&limit=10`);
    const json=await resp.json();
    if(json.success&&json.data&&json.data.length>0){renderApiResults(name,json);}
    else{renderNotFound(name);}
  }catch(e){renderNotFound(name);}
}

function renderApiResults(keyword,json){

      <div class="api-result-row">
        ${d.ingredient?`<span class="api-tag">成分：${d.ingredient.substring(0,30)}</span>`:''}
        ${d.dosageForm?`<span class="api-tag api-tag-gray">${d.dosageForm}</span>`:''}
        ${d.price&&d.price!='0.00'?`<span class="api-tag">健保價 ${d.price} 元</span>`:''}
        ${d.atcCode?`<span class="api-tag api-tag-gray">ATC: ${d.atcCode}</span>`:''}

      ${d.manufacturer?`<div style="font-size:11px;color:#aaa;margin-top:6px;">製造廠：${d.manufacturer}</div>`:''}
    </div>`).join('');
  document.getElementById('resultBox').innerHTML=`
    <div class="section-card" style="margin-bottom:12px;">
      <div class="section-label">🔍 「${keyword}」健保查詢結果</div>
      <div style="font-size:12px;color:#aaa;">共找到 ${json.total} 筆・顯示前 ${json.count} 筆</div>

    <div class="contact-card">
      <p>需要詳細用藥說明？歡迎詢問小彌藥師</p>
      <div class="line-id">💬 小彌藥師 @179ewiti</div>
      <button class="line-big-btn" onclick="openLine()">立即聯繫藥師</button>
    </div>
    <button class="again-btn" onclick="resetSearch()">🔍 再查詢另一個藥品</button>`;
}
