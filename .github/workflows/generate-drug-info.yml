name: 自動生成藥品說明

on:
  # 舊流程會生成不適合直接對民眾發布的用藥與保健品文字。
  # 已停用排程；保留手動入口只供歷史查核，新版公開頁不讀取其輸出。
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安裝 Python 套件
        run: pip install requests

      - name: 生成藥品說明
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_drug_info.py

      - name: 提交更新
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/drug_info/ data/drug_db.json data/drug_list.json
          git diff --staged --quiet || git commit -m "自動生成藥品說明 $(date '+%Y-%m-%d')"
          git push
