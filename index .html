<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藥單通｜仁川藥局專業藥師服務</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;}
header{background:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e8eaed;position:sticky;top:0;z-index:10;}
header h1{font-size:17px;font-weight:700;color:#1a6b4a;}
header span{font-size:12px;color:#aaa;margin-left:auto;}
.container{max-width:560px;margin:0 auto;padding:16px 14px 80px;}
.hero{text-align:center;padding:20px 0 16px;}
.hero h2{font-size:24px;font-weight:700;margin-bottom:4px;}
.hero p{font-size:13px;color:#666;}
.badge{display:inline-block;background:#e8f5ee;color:#1a6b4a;font-size:12px;padding:4px 14px;border-radius:20px;margin-top:8px;font-weight:600;}
.search-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.search-card label{font-size:13px;color:#555;display:block;margin-bottom:10px;font-weight:600;}
.search-row{display:flex;gap:8px;}
.search-row input{flex:1;font-size:15px;padding:11px 14px;border:1.5px solid #e0e3e8;border-radius:12px;background:#f7f8fa;color:#1a1a2e;outline:none;}
.search-row input:focus{border-color:#1a6b4a;background:#fff;}
.search-row button{padding:11px 18px;background:#1a6b4a;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-weight:700;white-space:nowrap;}
.quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.tag{font-size:12px;padding:5px 12px;border:1px solid #dde1e7;border-radius:20px;cursor:pointer;color:#555;background:#f7f8fa;}
.tag:hover{border-color:#1a6b4a;color:#1a6b4a;background:#e8f5ee;}
.drug-hero{background:linear-gradient(135deg,#1e7fe0,#1558a8);border-radius:16px;padding:22px 18px 18px;margin-bottom:12px;color:#fff;}
.drug-hero .pill-icon{font-size:36px;margin-bottom:10px;display:block;}
.drug-hero h3{font-size:24px;font-weight:800;line-height:1.3;margin-bottom:4px;}
.drug-hero .en{font-size:13px;opacity:0.85;}
.section-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.section-label{font-size:13px;font-weight:700;color:#1a6b4a;margin-bottom:10px;}
.section-content{font-size:15px;color:#222;line-height:1.8;}
.dose-box{background:#e8f5ee;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:8px;}
.dose-box .text{font-size:16px;font-weight:700;color:#1a6b4a;}
.red-header{background:#c0392b;border-radius:16px 16px 0 0;padding:14px 18px;}
.red-header span{font-size:16px;font-weight:700;color:#fff;}
.red-body{background:#fff;border-radius:0 0 16px 16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.red-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f3;font-size:14px;line-height:1.6;color:#333;}
.red-item:last-child{border-bottom:none;}
.emergency-header{background:#8b0000;border-radius:16px 16px 0 0;padding:14px 18px;}
.emergency-header span{font-size:16px;font-weight:700;color:#fff;}
.emergency-body{background:#fff4f4;border-radius:0 0 16px 16px;padding:16px 18px;margin-bottom:12px;}
.emergency-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #fdd;font-size:14px;line-height:1.6;color:#7a0000;}
.emergency-item:last-child{border-bottom:none;}
.orange-header{background:#e67e22;border-radius:16px 16px 0 0;padding:14px 18px;}
.orange-header span{font-size:16px;font-weight:700;color:#fff;}
.orange-body{background:#fff;border-radius:0 0 16px 16px;padding:16px 18px;margin-bottom:12px;}
.side-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;line-height:1.6;color:#444;}
.tips-card{background:#dbeeff;border-radius:16px;padding:18px;margin-bottom:12px;}
.tips-title{font-size:15px;font-weight:700;color:#0d47a1;margin-bottom:12px;}
.tip-item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px;line-height:1.6;color:#1a2a4a;}
.supp-card{background:linear-gradient(135deg,#2c2060,#1a1040);border-radius:16px;padding:18px;margin-bottom:12px;}
.supp-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.supp-title span{font-size:16px;font-weight:700;color:#fff;}
.supp-sub{font-size:12px;color:#aaa;margin-bottom:14px;}
.supp-item{background:rgba(255,255,255,0.08);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.supp-item .s-icon{font-size:28px;}
.supp-item .s-info{flex:1;}
.supp-item .s-name{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
.supp-item .s-desc{font-size:12px;color:#aaa;margin-top:3px;}
.discount-badge{background:#e67e22;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
.line-btn{background:#06c755;border:none;border-radius:12px;padding:14px;width:100%;font-size:15px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;}
.contact-card{background:#0d47a1;border-radius:16px;padding:20px 18px;margin-bottom:12px;text-align:center;}
.contact-card p{font-size:13px;color:#90caf9;margin-bottom:6px;}
.contact-card .line-id{font-size:20px;font-weight:800;color:#fff;}
.line-big-btn{background:#06c755;border:none;border-radius:14px;padding:16px;width:100%;font-size:16px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;}
.again-btn{background:#fff;border:2px solid #e0e3e8;border-radius:14px;padding:16px;width:100%;font-size:15px;font-weight:600;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;}
.empty-state{text-align:center;padding:32px 0;color:#aaa;font-size:14px;}
.empty-state .icon{font-size:40px;display:block;margin-bottom:12px;}
.loading{text-align:center;padding:28px 0;color:#888;font-size:14px;}
@media(max-width:480px){.search-row{flex-direction:column;}.drug-hero h3{font-size:20px;}}
</style>
</head>
<body>
<header>
  <span style="font-size:22px;">💊</span>
  <h1>藥單通｜專業藥師服務</h1>
  <span>仁川藥局</span>
</header>
<div class="container">
  <div class="hero">
    <h2>健保藥品查詢</h2>
    <p>輸入藥名，藥師 AI 立即說明</p>
    <span class="badge">✅ 完全免費 · 健保民眾適用</span>
  </div>
  <div class="search-card">
    <label>📋 請輸入藥品名稱（中文或英文均可）</label>
    <div class="search-row">
      <input type="text" id="drugInput" placeholder="例：脈優、冠脂妥、耐適恩..." />
      <button onclick="searchDrug()">查詢</button>
    </div>
    <div class="quick-tags">
      <span class="tag" onclick="qs('脈優')">脈優</span>
      <span class="tag" onclick="qs('冠脂妥')">冠脂妥</span>
      <span class="tag" onclick="qs('立普妥')">立普妥</span>
      <span class="tag" onclick="qs('耐適恩')">耐適恩</span>
      <span class="tag" onclick="qs('普拿疼')">普拿疼</span>
      <span class="tag" onclick="qs('福適佳')">福適佳</span>
      <span class="tag" onclick="qs('瑪爾胰')">瑪爾胰</span>
      <span class="tag" onclick="qs('阿斯匹靈')">阿斯匹靈</span>
      <span class="tag" onclick="qs('使蒂諾斯')">使蒂諾斯</span>
      <span class="tag" onclick="qs('活路利淨')">活路利淨</span>
      <span class="tag" onclick="qs('心得靜')">心得靜</span>
      <span class="tag" onclick="qs('利百適')">利百適</span>
    </div>
  </div>
  <div id="resultBox">
    <div class="empty-state">
      <span class="icon">💊</span>
      輸入藥品名稱開始查詢<br>
      <span style="font-size:12px;color:#ccc;margin-top:6px;display:block;">台灣健保藥品 · AI 藥師輔助說明</span>
    </div>
  </div>
</div>

<script>
const GEMINI_KEY = 'AQ.Ab8RN6JDROc-95K33ReTkJGGiyWEyemm-dNJluqXEvlcZ-6p1w';

function qs(name){document.getElementById('drugInput').value=name;searchDrug();}

async function searchDrug(){
  const name=document.getElementById('drugInput').value.trim();
  if(!name)return;
  const box=document.getElementById('resultBox');
  box.innerHTML=`<div class="loading">⏳ 正在查詢「${name}」的藥品資訊...</div>`;
  try{
    const prompt=`你是台灣仁川藥局的專業藥師AI助理，提供健保藥品資訊給一般民眾，使用繁體中文，語氣親切易懂。
只回傳JSON，不加任何markdown符號或說明文字，直接從{開始：
{"found":true,"name":"藥品中文名","englishName":"英文名/學名","icon":"emoji","category":"分類","what":"這是什麼藥2-3句","when":"飯前/飯後/睡前","dose":"每天幾次每次幾顆","warnings":["注意1","注意2","注意3"],"emergency":["急症1","急症2","急症3"],"sideEffects":["副作用1","副作用2","副作用3"],"tips":["叮嚀1","叮嚀2","叮嚀3"],"interactions":["交互1","交互2"],"supplements":[{"icon":"💊","name":"保健品","reason":"原因1句"},{"icon":"🐟","name":"保健品2","reason":"原因"}]}
找不到回傳：{"found":false}
請提供「${name}」的完整藥品資訊`;

    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': GEMINI_KEY
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.3 }
      })
    });

    const data = await res.json();
    if(data.error){
      box.innerHTML=`<div class="empty-state"><span class="icon">⚠️</span>API錯誤：${data.error.message}</div>`;
      return;
    }
    const text = data.candidates[0].content.parts[0].text;
    const match = text.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('回傳格式錯誤');
    const d = JSON.parse(match[0]);

    if(!d.found){
      box.innerHTML=`<div class="empty-state"><span class="icon">🔍</span>找不到「${name}」<br><span style="font-size:12px;color:#ccc;">請確認藥品名稱，或聯繫仁川藥局藥師</span></div>`;
      return;
    }
    renderResult(d);
  }catch(e){
    box.innerHTML=`<div class="empty-state"><span class="icon">📡</span>查詢失敗，請稍後再試<br><span style="font-size:12px;color:#ccc;">${e.message}</span></div>`;
  }
}

function renderResult(d){
  const warnings=(d.warnings||[]).map(w=>`<div class="red-item">⚠️ &nbsp;${w}</div>`).join('');
  const emergency=(d.emergency||[]).map(e=>`<div class="emergency-item">🚨 &nbsp;${e}</div>`).join('');
  const sides=(d.sideEffects||[]).map(s=>`<div class="side-item">🔸 ${s}</div>`).join('');
  const tips=(d.tips||[]).map(t=>`<div class="tip-item">💡 &nbsp;${t}</div>`).join('');
  const interactions=(d.interactions||[]).map(i=>`<div class="red-item">🚫 &nbsp;${i}</div>`).join('');
  const supps=(d.supplements||[]).map(s=>`<div class="supp-item"><span class="s-icon">${s.icon}</span><div class="s-info"><div class="s-name">${s.name} <span class="discount-badge">首次75折</span></div><div class="s-desc">${s.reason}</div></div></div>`).join('');

  document.getElementById('resultBox').innerHTML=`
    <div class="drug-hero">
      <span class="pill-icon">${d.icon||'💊'}</span>
      <h3>${d.name}</h3>
      <div class="en">${d.englishName||''}</div>
    </div>
    <div class="section-card">
      <div class="section-label">這是什麼藥？</div>
      <div class="section-content">${d.what||''}</div>
      <div class="dose-box" style="margin-top:14px;"><span style="font-size:22px;">⏰</span><span class="text">${d.when||''}</span></div>
      <div style="font-size:18px;font-weight:800;color:#1a6b4a;margin-top:12px;">${d.dose||''}</div>
    </div>
    ${warnings?`<div><div class="red-header"><span>🚫 重要注意事項</span></div><div class="red-body">${warnings}</div></div>`:''}
    ${emergency?`<div><div class="emergency-header"><span>🚨 出現這些要馬上看醫生！</span></div><div class="emergency-body">${emergency}</div></div>`:''}
    ${sides?`<div><div class="orange-header"><span>⚡ 可能的副作用</span></div><div class="orange-body">${sides}</div></div>`:''}
    ${interactions?`<div><div class="red-header"><span>💊 注意交互作用</span></div><div class="red-body">${interactions}</div></div>`:''}
    ${tips?`<div class="tips-card"><div class="tips-title">💙 藥師小叮嚀</div>${tips}</div>`:''}
    ${supps?`<div class="supp-card"><div class="supp-title"><span>🌿</span><span>藥師推薦保健品</span></div><div class="supp-sub">根據您的用藥，藥師建議搭配以下保健品</div>${supps}<button class="line-btn" onclick="openLine()">💬 聯繫藥師了解詳情</button></div>`:''}
    <div class="contact-card">
      <p>有任何問題歡迎詢問專業藥師</p>
      <div class="line-id">💬 仁川藥局 @179ewiti</div>
      <button class="line-big-btn" onclick="openLine()">立即聯繫藥師</button>
    </div>
    <button class="again-btn" onclick="resetSearch()">📷 再查詢另一個藥品</button>`;
}

function openLine(){window.open('https://line.me/ti/p/@179ewiti','_blank');}
function resetSearch(){
  document.getElementById('drugInput').value='';
  document.getElementById('resultBox').innerHTML=`<div class="empty-state"><span class="icon">💊</span>輸入藥品名稱開始查詢</div>`;
  document.getElementById('drugInput').focus();
}
document.getElementById('drugInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchDrug();});
</script>
</body>
</html>
